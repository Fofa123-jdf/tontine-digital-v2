<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b4fa8"><title>Tontine Digital 1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#effaf3;--card:#fff;--tx:#14312a;--mu:#5f7a70;--g:#0a9b6e;--gd:#066b4c;--gold:#f5b92e;--bd:#d6eadf;--ok:#dcf5e8;--okt:#066b4c;--sh:0 6px 18px rgba(8,100,70,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a15;--card:#16251e;--tx:#e6f3ed;--mu:#9bb8ab;--bd:#254036;--ok:#14382b;--okt:#8fe8c4;--sh:none}}
:root[data-theme="dark"]{--bg:#0d1a15;--card:#16251e;--tx:#e6f3ed;--mu:#9bb8ab;--bd:#254036;--ok:#14382b;--okt:#8fe8c4;--sh:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;padding-bottom:100px}
#app{max-width:560px;margin:auto;padding:0 14px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}
.lg{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--g),var(--gd));color:var(--gold);display:grid;place-items:center}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sw{display:flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--sh)}
.sw button{border:0;background:none;color:var(--mu);padding:6px 14px;border-radius:999px;font:700 13px Nunito,sans-serif;cursor:pointer}
.sw .on,.tabs .on{background:var(--g);color:#fff}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:10px}.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:10px;font:700 14px Nunito,sans-serif;cursor:pointer}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0a9b6e,#066b4c);color:#fff;border-radius:24px;padding:20px;min-height:160px;margin:6px 0 14px;box-shadow:var(--sh)}
.hero h2{margin:4px 0;font-size:25px;font-weight:800;max-width:62%}.hero p{margin:2px 0;max-width:62%;opacity:.92}
.art{position:absolute;right:-6px;bottom:0;width:48%}
.c{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh);overflow-wrap:anywhere}
h3{margin:0 0 6px;font-size:19px;font-weight:800}
input,select{width:100%;padding:12px;margin:5px 0;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:none;border-color:var(--g)}
.b{width:100%;padding:13px;margin-top:8px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;font:800 15px Nunito,sans-serif;cursor:pointer;box-shadow:0 4px 12px rgba(8,100,70,.3)}
.l{background:none;border:0;color:var(--g);padding:8px;font:800 14px Nunito,sans-serif;cursor:pointer}
.mu{color:var(--mu);margin:4px 0}small.mu{font-size:12px}
.msg{background:var(--ok);color:var(--okt);padding:12px;border-radius:14px;margin:8px 0;font-weight:700}.w{background:#fff1c9;color:#6b4e00}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g .c{margin:0}.g .c b{font-size:18px}
.tile{background:var(--card);border:0;border-radius:18px;padding:16px 10px;font:800 14px Nunito,sans-serif;color:var(--tx);cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:10px}
.ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff}.ic .i{width:26px;height:26px}
nav{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;right:8px;max-width:544px;margin:0 auto;display:flex;background:var(--card);border-radius:24px;box-shadow:0 8px 28px rgba(8,100,70,.22);padding:6px}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:7px 0;border-radius:18px;font:700 11px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav br{display:none}nav .on{background:var(--ok);color:var(--g)}
.ok{color:var(--g);font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.ck{display:flex;gap:8px;align-items:center;margin:8px 0}.ck input{width:auto}
.wel{position:fixed;inset:0;z-index:5;overflow:auto;display:flex;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 24px;background:radial-gradient(circle at 50% 28%,#1b6fd6 0%,#0b4fa8 42%,#052a63 100%);color:#fff;text-align:center}
.wt{font:800 56px/.95 'Baloo 2',Nunito,sans-serif;transform:skewX(-8deg);text-shadow:0 4px 0 rgba(0,0,0,.25)}
.wt2{display:flex;justify-content:center;align-items:center;gap:10px;transform:skewX(-8deg)}.wt2 span{font:800 50px/1 'Baloo 2',Nunito,sans-serif;color:#fbbf24;text-shadow:0 4px 0 rgba(0,0,0,.25)}.wt2 i{font:800 18px Nunito,sans-serif;font-style:normal;background:#16a34a;padding:2px 10px;border-radius:8px;margin-top:12px}
.wtag{font-size:18px;font-weight:700;margin:12px 0 8px}.wbar{display:flex;gap:6px;justify-content:center}.wbar b{width:56px;height:4px;border-radius:2px}
.wcap{font-size:12px;font-weight:700;letter-spacing:.12em;color:#d4e6ff;margin:10px 0 22px}
.bg,.bo{width:100%;height:54px;margin-top:12px;border-radius:18px;font:800 17px Nunito,sans-serif;cursor:pointer}.bg{border:0;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0b2a5c;box-shadow:0 8px 20px rgba(245,158,11,.4)}.bo{border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.08);color:#fff}
body{background:radial-gradient(circle at 50% 18%,#1b6fd6 0%,#0b4fa8 45%,#052a63 100%);background-attachment:fixed;min-height:100vh}
#app{position:relative;z-index:1}
.logo{color:#fff}
#app>.l{color:#dbeafe}
.bgart{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.13}
.bgart svg{width:min(130vw,640px)!important;max-width:none!important;height:auto!important}
</style></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>

<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21h4"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
</defs></svg><div id="app"><div style="margin:16px;padding:16px;border-radius:12px;background:#0b4fa8;color:#fff;font-family:sans-serif">Chargement…</div></div>
<script>
(function(){function show(m){var a=document.getElementById('app');if(a)a.innerHTML='<div style="margin:16px;padding:16px;border-radius:12px;background:#0b4fa8;color:#fff;font-family:sans-serif"><h2 style="margin:0 0 8px">Erreur d\u2019affichage</h2><p style="margin:0;word-break:break-word">'+String(m).replace(/</g,'&lt;')+'</p></div>'}
window.addEventListener('error',function(e){show(e.message||e.error)});
window.addEventListener('unhandledrejection',function(e){show(e.reason&&e.reason.message||e.reason)});})();
</script>

<script>
const TREE=`<svg viewBox="0 0 340 330" style="width:100%;max-width:340px;height:auto" role="img" aria-label="Un arbre qui produit des pièces, porté par une main, entouré de membres de la communauté et d'un téléphone">
<defs>
<linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<g id="coin"><circle r="11" fill="url(#gd)" stroke="#b45309" stroke-width="2"/><circle r="7.5" fill="none" stroke="#b45309" stroke-width="1.2" opacity=".7"/><text y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#b45309" font-family="Baloo 2,sans-serif">F</text></g>
<g id="spark"><path d="M0-9L2.4-2.4 9 0 2.4 2.4 0 9-2.4 2.4-9 0-2.4-2.4z" fill="#fde68a"/></g>
</defs>
<circle cx="170" cy="165" r="158" fill="#06306b" opacity=".55" stroke="#f7b500" stroke-width="6"/>
<use href="#spark" x="62" y="78"/><use href="#spark" x="118" y="34" transform="translate(0 0)"/><use href="#spark" x="296" y="170"/>
<path d="M52 238C70 302 270 302 288 238 262 268 230 276 170 276 110 276 78 268 52 238z" fill="#fbbf24"/>
<path d="M150 258C154 222 150 196 140 168L200 168C190 196 186 222 190 258z" fill="#92400e"/>
<g stroke="#92400e" stroke-width="9" stroke-linecap="round" fill="none"><path d="M168 196L122 150"/><path d="M172 196L220 148"/><path d="M170 178V128"/></g>
<circle cx="170" cy="96" r="46" fill="#1f9d4a"/><circle cx="122" cy="124" r="34" fill="#2dbb55"/><circle cx="218" cy="124" r="34" fill="#1d9a45"/><circle cx="148" cy="72" r="31" fill="#34c759"/><circle cx="196" cy="70" r="31" fill="#2dbb55"/><circle cx="170" cy="130" r="34" fill="#25a84f"/>
<circle cx="140" cy="62" r="10" fill="#6ee7a0" opacity=".5"/>
<use href="#coin" transform="translate(140 92) scale(1.15)"/><use href="#coin" transform="translate(198 80) scale(1.15)"/><use href="#coin" transform="translate(170 118) scale(1.25)"/><use href="#coin" transform="translate(112 128)"/><use href="#coin" transform="translate(228 128)"/><use href="#coin" transform="translate(166 50)"/><use href="#coin" transform="translate(212 108)"/>
<use href="#coin" transform="translate(104 178) scale(.9)"/><use href="#coin" transform="translate(238 186) scale(.9)"/><use href="#coin" transform="translate(206 214) scale(.8)"/>
<g fill="url(#gd)" stroke="#b45309" stroke-width="2"><ellipse cx="170" cy="266" rx="32" ry="8"/><ellipse cx="170" cy="258" rx="32" ry="8"/><ellipse cx="170" cy="250" rx="32" ry="8"/></g>
<circle cx="58" cy="152" r="17" fill="#2fb344"/><path d="M28 238c0-36 12-54 30-54s30 18 30 54z" fill="#2fb344"/>
<circle cx="282" cy="152" r="17" fill="#3b82f6"/><path d="M252 238c0-36 12-54 30-54s30 18 30 54z" fill="#3b82f6"/>
<g transform="rotate(14 292 92)"><rect x="268" y="52" width="46" height="80" rx="9" fill="#0b3a8f" stroke="#9cc4ff" stroke-width="3"/><circle cx="291" cy="94" r="13" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M285 94l5 5 9-10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>`;
const ART=`<svg class="art" viewBox="0 0 130 100" aria-hidden="true"><circle cx="100" cy="24" r="22" fill="#f5b92e" opacity=".25"/><circle cx="100" cy="24" r="15" fill="#f5b92e"/><ellipse cx="62" cy="93" rx="34" ry="5" fill="#000" opacity=".15"/><circle cx="30" cy="50" r="9" fill="#fff"/><path d="M14 84c0-13 7-19 16-19s16 6 16 19z" fill="#fff"/><circle cx="62" cy="40" r="10" fill="#ffd56b"/><path d="M44 86c0-15 8-22 18-22s18 7 18 22z" fill="#ffd56b"/><circle cx="96" cy="54" r="9" fill="#ffb27a"/><path d="M80 86c0-13 7-19 16-19s16 6 16 19z" fill="#ffb27a"/></svg>`;
window.API_BASE = window.API_BASE || '';
const API = window.API_BASE + '/api', $ = (i) => document.getElementById(i), V = (i) => ($(i).value || '').trim();
const f = (n) => Number(n).toLocaleString('fr-FR') + ' FCFA';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const I = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const day = (x) => new Date(x).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const NM = [['menu', 'grid', 'Menu'], ['tont', 'users', 'Tontines'], ['pay', 'card', 'Cotiser'], ['hist', 'history', 'Historique'], ['prof', 'user', 'Profil']];
const REF = new URLSearchParams(location.search).get('ref') || '';
const LOGO = `<div class="logo"><span class="lg">${I('coin')}</span>Tontine Digital</div>`;
let T = null, U = null, view = 'home', tab = 'menu', msg = '', draft = null, docFile = null, phone0 = '', devotp = '', ct = 0;
try { T = localStorage.getItem('td_t'); } catch (e) {}

async function api(p, o) {
  o = o || {};
  const h = { 'Content-Type': 'application/json' };
  if (T) h.Authorization = 'Bearer ' + T;
  let r;
  try { r = await fetch(API + p, { method: o.m || 'GET', headers: h, body: o.b ? JSON.stringify(o.b) : undefined }); }
  catch (e) { throw new Error('Connexion impossible. Vérifiez votre réseau.'); }
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok) { if (r.status == 401 && T && p != '/auth/login') out(); throw new Error(d.error || 'Erreur (' + r.status + ')'); }
  return d;
}
function setT(t) { T = t; try { localStorage.setItem('td_t', t); } catch (e) {} }
function out() { T = null; U = null; try { localStorage.removeItem('td_t'); } catch (e) {} view = 'home'; R(); }
function er(m) { const e = $('err'); if (e) { e.textContent = m; e.hidden = false; e.scrollIntoView({ block: 'nearest' }); } }
async function wait(fn) { try { await fn(); } catch (e) { er(e.message); } }
function go(t) { tab = t; R(); }
function img(file) {
  return new Promise((ok, ko) => {
    const i = new Image(), u = URL.createObjectURL(file);
    i.onload = () => {
      const k = Math.min(1, 1200 / Math.max(i.width, i.height)), c = document.createElement('canvas');
      c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.8));
    };
    i.onerror = () => ko(new Error('Image illisible'));
    i.src = u;
  });
}

function W() {
  return `<div class="wel"><div style="max-width:380px;width:100%;margin:auto">${TREE}<div class="wt">Tontine</div><div class="wt2"><span>Digital</span><i>1.0</i></div><p class="wtag">Ensemble pour un meilleur avenir</p><div class="wbar"><b style="background:#fbbf24"></b><b style="background:#22c55e"></b><b style="background:#3b82f6"></b></div><p class="wcap">ÉPARGNE • SOLIDARITÉ • PROSPÉRITÉ</p><button class="bg" onclick="view='up';R()">Créer mon compte</button><button class="bo" onclick="view='in';R()">Se connecter</button></div></div>`;
}
function AU() {
  const back = `<button class="l" onclick="view='home';R()">← Accueil</button>`;
  const test = devotp ? `<p class="mu">Code de test : <b>${esc(devotp)}</b></p>` : '';
  if (view == 'otp') return `<div class="c"><h3>Vérification du numéro</h3><p class="mu">Un code a été envoyé par SMS au ${esc(draft.phone)}.</p>${test}<input id="oc" inputmode="numeric" placeholder="Code à 6 chiffres"><button class="b" onclick="wait(chk)">Valider le code</button><button class="l" onclick="view='up';R()">Modifier mes informations</button></div>`;
  if (view == 'forgot') return `<div class="c">${back}<h3>Mot de passe oublié</h3><input id="t" inputmode="tel" placeholder="Téléphone"><button class="b" onclick="wait(forgot)">Recevoir un code</button></div>`;
  if (view == 'reset') return `<div class="c"><h3>Nouveau mot de passe</h3>${test}<input id="oc" inputmode="numeric" placeholder="Code reçu par SMS"><input id="p" type="password" placeholder="Nouveau mot de passe (8 caractères min.)"><button class="b" onclick="wait(reset)">Changer le mot de passe</button></div>`;
  const up = view == 'up';
  return `<div class="c">${back}<div class="tabs"><button class="${up ? '' : 'on'}" onclick="view='in';R()">Connexion</button><button class="${up ? 'on' : ''}" onclick="view='up';R()">Inscription</button></div>` + (up
    ? `<input id="n" placeholder="Nom complet"><input id="d" type="date" title="Date de naissance"><input id="t" inputmode="tel" placeholder="Téléphone (10 chiffres)"><input id="e" type="email" placeholder="Email (facultatif)"><select id="dt"><option>CNI</option><option>Passeport</option><option>Carte consulaire</option><option>Autre</option></select><input id="dn" placeholder="Numéro du document"><label class="mu">Photo du document (recommandé)<input id="df" type="file" accept="image/*"></label><input id="r" placeholder="Code parrain (facultatif)" value="${esc(REF)}"><input id="p" type="password" placeholder="Mot de passe (8 caractères min.)"><label class="ck"><input id="cg" type="checkbox"> J'accepte les conditions d'utilisation</label><button class="b" onclick="wait(reg)">Recevoir le code SMS</button>`
    : `<input id="t" inputmode="tel" placeholder="Téléphone"><input id="p" type="password" placeholder="Mot de passe"><button class="b" onclick="wait(log)">Se connecter</button><button class="l" onclick="view='forgot';R()">Mot de passe oublié ?</button>`) + `</div>`;
}
async function reg() {
  const b = { name: V('n'), birth_date: V('d'), phone: V('t'), email: V('e') || undefined, doc_type: V('dt'), doc_number: V('dn'), password: $('p').value, referral_code: V('r') || undefined, accept_terms: $('cg').checked };
  docFile = $('df').files[0] || null;
  const d = await api('/auth/register', { m: 'POST', b });
  draft = { phone: b.phone }; devotp = d.dev_otp || ''; view = 'otp'; R();
}
async function chk() {
  const d = await api('/auth/verify-otp', { m: 'POST', b: { phone: draft.phone, code: V('oc') } });
  setT(d.token); U = d.user; devotp = ''; tab = 'menu';
  if (docFile) { try { await api('/me/document', { m: 'POST', b: { image: await img(docFile) } }); } catch (e) {} docFile = null; }
  msg = "Compte créé. Il sera actif après validation par l'administrateur."; R();
}
async function log() { const d = await api('/auth/login', { m: 'POST', b: { phone: V('t'), password: $('p').value } }); setT(d.token); U = d.user; tab = 'menu'; R(); }
async function forgot() { const d = await api('/auth/forgot', { m: 'POST', b: { phone: V('t') } }); phone0 = V('t'); devotp = d.dev_otp || ''; view = 'reset'; msg = d.message; R(); }
async function reset() { await api('/auth/reset', { m: 'POST', b: { phone: phone0, code: V('oc'), new_password: $('p').value } }); devotp = ''; view = 'in'; msg = 'Mot de passe modifié. Connectez-vous.'; R(); }

async function join(id) { await api('/tontines/' + id + '/join', { m: 'POST' }); msg = 'Vous avez rejoint la tontine.'; R(); }
async function quote() { const d = await api('/payments/quote?tontine_id=' + $('pt').value); $('qq').textContent = `Cotisation ${f(d.amount)} + commission ${f(d.fee)} = ${f(d.total)}`; }
async function pay() {
  er('Création du paiement…');
  const d = await api('/payments', { m: 'POST', b: { tontine_id: +$('pt').value, method: $('pm').value, payer_phone: V('pp') } });
  if (d.checkout_url) { location.href = d.checkout_url; return; }
  if (d.mock) { await api('/payments/' + d.payment_id + '/simulate', { m: 'POST' }); msg = 'Paiement confirmé (mode test) : ' + f(d.total); tab = 'hist'; return R(); }
  er('Confirmez le paiement sur votre téléphone…');
  for (let i = 0; i < 30; i++) {
    await new Promise((r) => setTimeout(r, 3000));
    const s = (await api('/payments/' + d.payment_id)).status;
    if (s == 'paid') { msg = 'Paiement confirmé : ' + f(d.total); tab = 'hist'; return R(); }
    if (s == 'failed') throw new Error('Paiement refusé ou annulé.');
  }
  msg = 'Paiement en attente de confirmation. Consultez votre historique.'; tab = 'hist'; R();
}
async function send(id) { const v = V('cm'); if (!v) return; await api('/tontines/' + id + '/messages', { m: 'POST', b: { body: v } }); R(); }
async function chp() { await api('/me/password', { m: 'POST', b: { old_password: $('op').value, new_password: $('np').value } }); msg = 'Mot de passe modifié.'; R(); }
async function upDoc() { const fl = $('df').files[0]; if (!fl) throw new Error('Choisissez une photo.'); await api('/me/document', { m: 'POST', b: { image: await img(fl) } }); msg = 'Photo envoyée.'; R(); }

async function P() {

  }
  if (tab == 'tont') b += (await api('/tontines')).tontines.map((x) => `<div class="c"><b>${esc(x.name)}</b><p class="mu">${f(x.amount)} par ${x.frequency == 'mois' ? 'mois' : 'semaine'} · ${x.members}/${x.max_members} membre(s)${x.status == 'running' ? ' · en cours' : ''}</p>${x.joined ? '<span class="ok">Inscrit</span>' : x.status == 'open' ? `<button class="b" onclick="wait(()=>join(${x.id}))">Rejoindre</button>` : '<span class="mu">Inscriptions closes</span>'}</div>`).join('') || '<div class="c">Aucune tontine ouverte pour le moment.</div>';
  if (tab == 'pay') {
    const mine = (await api('/tontines')).tontines.filter((x) => x.joined);
    b += mine.length ? `<div class="c"><h3>Cotiser</h3><select id="pt" onchange="wait(quote)">${mine.map((x) => `<option value="${x.id}">${esc(x.name)} — ${f(x.amount)}</option>`).join('')}</select><select id="pm"><option value="wave">Wave CI</option><option value="orange">Orange Money CI</option><option value="mtn">MTN MoMo</option></select><input id="pp" inputmode="tel" placeholder="Numéro qui paie (10 chiffres)" value="${esc(U.phone)}"><p id="qq" class="mu"></p><button class="b" onclick="wait(pay)">Payer</button></div>` : `<div class="c">Rejoignez d'abord une tontine pour cotiser.</div>`;
  }
  if (tab == 'hist') { const h = (await api('/payments')).payments; b += `<div class="c"><h3>Historique</h3>${h.map((x) => `<div class="row"><span>${esc(x.tontine)}<br><small class="mu">${new Date(x.created_at).toLocaleString('fr-FR')} · ${esc(x.method)} · ${{ paid: 'payé', pending: 'en attente', failed: 'échoué' }[x.status]}</small></span><b>${f(x.amount + x.fee)}</b></div>`).join('') || '<p class="mu">Aucune cotisation pour le moment.</p>'}</div>`; }
  if (tab == 'cal') { const it = (await api('/calendar')).items; b += `<div class="c"><h3>Calendrier</h3>${it.map((x) => `<div class="row"><span>${esc(x.name)}<br><small class="mu">${x.beneficiary ? 'Bénéficiaire du tour : ' + esc(x.beneficiary) : 'Tirage non effectué'}${x.my_position ? ' · mon tour : n°' + x.my_position : ''}</small></span><b>${day(x.next_due)}</b></div>`).join('') || '<p class="mu">Rejoignez une tontine pour voir vos échéances.</p>'}</div>`; }
  if (tab == 'chat') {
    const mine = (await api('/tontines')).tontines.filter((x) => x.joined);
    if (!mine.length) b += `<div class="c">Rejoignez une tontine pour discuter avec le groupe.</div>`;
    else {
      const id = mine.some((x) => x.id == ct) ? ct : mine[0].id, ms = (await api('/tontines/' + id + '/messages')).messages;
      b += `<div class="c"><h3>Discussion</h3><select onchange="ct=+this.value;R()">${mine.map((x) => `<option value="${x.id}" ${x.id == id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>${ms.map((m) => `<div class="row"><span><b>${esc(m.author)}</b><br>${esc(m.body)}<br><small class="mu">${new Date(m.created_at).toLocaleString('fr-FR')}</small></span></div>`).join('') || '<p class="mu">Aucun message. Lancez la discussion !</p>'}<input id="cm" maxlength="500" placeholder="Votre message"><button class="b" onclick="wait(()=>send(${id}))">Envoyer</button></div>`;
    }
  }
  if (tab == 'notif') { const n = (await api('/notifications')).notifications; api('/notifications/read', { m: 'POST' }).catch(() => {}); b += `<div class="c"><h3>Notifications</h3>${n.map((x) => `<div class="row"><span>${esc(x.body)}<br><small class="mu">${new Date(x.created_at).toLocaleString('fr-FR')}</small></span></div>`).join('') || '<p class="mu">Aucune notification.</p>'}</div>`; }
  if (tab == 'parr') { const d = await api('/referral'); b += `<div class="hero"><p>Mon code parrain</p><h2>${esc(d.code)}</h2><p>Partagez-le avec vos proches</p>${ART}</div><div class="c"><p>Filleuls directs : <b>${d.referred}</b></p><p>Commission gagnée : <b>${f(d.earned)}</b></p><small class="mu">2 % de la première cotisation de chaque filleul.</small><button class="b" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.origin+'/member/?ref=${esc(d.code)}');er('Lien copié.')">Copier mon lien d'invitation</button></div>`; }

  return b;
}
async function R() {
  const m = msg; msg = '';
  if (T) { try { U = (await api('/me')).user; } catch (e) { if (!T) return; } }
  const banner = `<div id="err" class="msg" ${m ? '' : 'hidden'}>${esc(m)}</div>`;
  if (!T || !U) { $('app').innerHTML = view == 'home' ? W() : `<div class="top">${LOGO}</div>${banner}${AU()}`; return; }
  let b; try { b = await P(); } catch (e) { b = `<div class="msg w">${esc(e.message)}</div>`; }
  const nav = `<nav>${NM.map((n) => `<button class="${tab == n[0] ? 'on' : ''}" onclick="go('${n[0]}')">${I(n[1])}<br>${n[2]}</button>`).join('')}</nav>`;
  $('app').innerHTML = `<div class="top">${LOGO}</div>${banner}${tab == 'menu' ? '' : `<button class="l" onclick="go('menu')">← Retour au menu</button>`}${b}${nav}`;

  window.scrollTo(0, 0);
}
